plugins {
  alias(libs.plugins.android.application)
  alias(libs.plugins.kotlin.android)
  id "dev.flutter.flutter-gradle-plugin"
  alias(libs.plugins.ksp)
  alias(libs.plugins.kotlin.serialization)
  alias(libs.plugins.kotlin.compose)
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
  keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
  compileSdk = flutter.compileSdkVersion
  ndkVersion = flutter.ndkVersion

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  sourceSets {
    main.java.srcDirs += 'src/main/kotlin'
  }

  buildFeatures {
    buildConfig true
    compose true
  }

  defaultConfig {
    applicationId "app.alextran.immich"
    minSdk = 26
    targetSdk = flutter.targetSdkVersion
    versionCode flutter.versionCode
    versionName flutter.versionName
    resValue "string", "app_name", "Immich"
    buildConfigField "boolean", "PASSKEYS", "true"
  }

  signingConfigs {
    release {
      def keyAliasVal = System.getenv("ALIAS")
      def keyPasswordVal = System.getenv("ANDROID_KEY_PASSWORD")
      def storePasswordVal = System.getenv("ANDROID_STORE_PASSWORD")

      keyAlias keyAliasVal ?: keystoreProperties['keyAlias']
      keyPassword keyPasswordVal ?: keystoreProperties['keyPassword']
      storeFile file("../key.jks").exists() ? file("../key.jks") : file(keystoreProperties['storeFile'] ?: '../key.jks')
      storePassword storePasswordVal ?: keystoreProperties['storePassword']
    }
  }

  buildTypes {
    debug {
      applicationIdSuffix '.debug'
      versionNameSuffix '-DEBUG'
    }

    release {
      def hasKeystore = file("../key.jks").exists() && file("../key.jks").length() > 0
      signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

      def appIdSuffix = System.getenv("APP_ID_SUFFIX")
      def prNumber = System.getenv("PR_NUMBER")
      if (appIdSuffix) {
        applicationIdSuffix appIdSuffix
        resValue "string", "app_name", System.getenv("IMMICH_APP_NAME") ?: "Immich"
      } else if (prNumber) {
        applicationIdSuffix ".pr${prNumber}"
        versionNameSuffix "-pr${prNumber}"
        resValue "string", "app_name", "Immich PR ${prNumber}"
      }
    }
  }
  namespace 'app.alextran.immich'

  // Immich Plus: APK più leggero, attivato solo dalle variabili d'ambiente del workflow Firebase.
  // ANDROID_ABI_ONLY=arm64-v8a scarta le librerie native delle altre ABI che arrivano dalle
  // dipendenze AAR (Cronet, MapLibre, ...), che --target-platform di Flutter non filtra.
  // ANDROID_COMPRESS_NATIVE_LIBS=true comprime le .so nell'APK (vengono estratte all'installazione).
  def abiOnly = System.getenv("ANDROID_ABI_ONLY")
  def compressNativeLibs = System.getenv("ANDROID_COMPRESS_NATIVE_LIBS") == "true"
  packaging {
    jniLibs {
      if (abiOnly) {
        ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].findAll { it != abiOnly }.each {
          excludes.add("**/${it}/*.so".toString())
        }
      }
      if (compressNativeLibs) {
        useLegacyPackaging = true
      }
    }
  }
}

flutter {
  source '../..'
}

dependencies {
  implementation libs.okhttp
  implementation libs.cronet.embedded
  implementation libs.media3.datasource.okhttp
  implementation libs.media3.datasource.cronet
  implementation libs.kotlinx.coroutines.android
  implementation libs.work.runtime.ktx
  implementation libs.concurrent.futures
  implementation libs.guava
  implementation libs.glide
  implementation libs.kotlinx.serialization.json
  implementation libs.credentials
  implementation libs.credentials.play.services.auth

  ksp libs.glide.ksp
  coreLibraryDesugaring libs.desugar.jdk.libs

  //Glance Widget
  implementation libs.glance.appwidget
  implementation libs.gson

  // Glance Configure
  implementation libs.activity.compose
  implementation libs.compose.ui
  implementation libs.compose.ui.tooling
  implementation libs.compose.material3
  implementation libs.lifecycle.runtime.ktx
  implementation libs.material
}

